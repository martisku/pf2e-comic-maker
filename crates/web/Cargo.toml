[package]
name = "comic-web"
version = "0.1.0"
edition.workspace = true

[dependencies]
comic-model.workspace = true
serde.workspace = true
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"] }
gloo-net = { version = "0.6", features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "UrlSearchParams", "BeforeUnloadEvent", "Event", "EventTarget", "Document", "Element", "HtmlDialogElement", "PopStateEvent"] }
