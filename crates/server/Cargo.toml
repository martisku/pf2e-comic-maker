[package]
name = "comic-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
comic-model.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "migrate", "macros"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
